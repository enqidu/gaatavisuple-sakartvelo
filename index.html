<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Without this a phone renders the page at a fake 980px desktop width and
     zooms out, so even the "needs a keyboard" notice comes out unreadable. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gaatavisuple Sakartvelo</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%;
    background: #0a0c12;
    overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #wrap {
    position: fixed; inset: 0;
    display: grid; place-items: center;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    background: #6db3f2;
    box-shadow: 0 24px 80px rgba(0,0,0,.6);
  }
  #boot {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: #0a0c12; color: #cfd6e4;
    font-size: 14px; letter-spacing: .08em;
    z-index: 10;
  }
  #boot.hidden { display: none; }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
  <!-- canvas dimensions are set from VIEW_W/VIEW_H * SCALE at boot -->
  <div id="boot">LOADING…</div>
  <!-- The ?v= is a cache buster, and it has to be bumped on every push that
       touches game.js. GitHub Pages serves the script with a long max-age, so
       without it a returning player keeps running the previous build and the
       change you just shipped simply is not there. index.html itself is served
       with max-age=600, so the new number reaches them within ten minutes and
       pulls the new script with it. -->
  <script src="game.js?v=19"></script>
</body>
</html>
