<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gaatavisuple Sakartvelo</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%;
    background: #0a0c12;
    overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #wrap {
    position: fixed; inset: 0;
    display: grid; place-items: center;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    background: #6db3f2;
    box-shadow: 0 24px 80px rgba(0,0,0,.6);
  }
  #boot {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: #0a0c12; color: #cfd6e4;
    font-size: 14px; letter-spacing: .08em;
    z-index: 10;
  }
  #boot.hidden { display: none; }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
  <!-- canvas dimensions are set from VIEW_W/VIEW_H * SCALE at boot -->
  <div id="boot">LOADING…</div>
  <script src="game.js"></script>
</body>
</html>
